<!doctype html>
<html lang="en">
  <head>
    <title>Carousel View</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Marshall" />
    <meta name="description" content="Carousel page" />
    <link href="/app/favicon.ico" rel="favicon" />
    <link href="assets/vendor/normalize.css" rel="stylesheet" />
    <link href="assets/css/carousel.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="page">
    <header class="header">
      <h1 class="header__title">
        <a class="header__link" href="index.html">Flash Cards</a>
      </h1>
      <nav class="nav">
        <div class="nav__links">
          <a class="nav__link" href="index.html">My Decks</a>
          <a class="nav__link" href="About">About</a>
        </div>
      </nav>
    </header>
    <main class="page__main-content page__main-content_location_carousel">
      <section id="carousel" class="carousel">
        <h2 class="carousel__title">
          <span></span>
        </h2>
        <div class="carousel__row">
          <button
            type="button"
            aria-label="Go to previous card in deck"
            class="carousel__btn carousel__btn_type_left carousel__btn_disabled"
          ></button>
          <div class="carousel__card">
            <p class="carousel__card_text">&lt;body&gt;&lt;/body&gt;</p>
          </div>
          <button
            type="button"
            aria-label="Go to next card in deck"
            class="carousel__btn carousel__btn_type_right"
          ></button>
        </div>
        <button
          type="button"
          aria-label="Flip card"
          class="carousel__btn carousel__btn_type_flip"
        ></button>
      </section>
    </main>
    <footer class="footer">
      <p class="footer__text">&copy 2026 Marshall Brown</p>
    </footer>
    <script type="module">
      import { decks } from "./assets/js/decks.js";
      import { renderCarouselView } from "./assets/js/carousel.js";

      renderCarouselView(decks[0]);
    </script>
  </body>
</html>
