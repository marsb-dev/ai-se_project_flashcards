<!doctype html>
<html lang="en">
  <head>
    <title>Deck Gallery</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Marshall Landing page for flashcard app" />
    <link
      rel="icon"
      type="image/png"
      href="./assets/images/gallery-vertical-end-white.png"
    />
    <link href="./favicon.ico" rel="favicon" />
    <link href="./assets/css/style.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <script src="assets/js/index.js" type="module"></script>
  </head>
  <body class="page page_type_index">
    <header class="header">
      <h1 class="header__title">
        <a class="header__link" href="#home">Flash Cards</a>
      </h1>
      <nav class="nav">
        <ul class="nav__links">
          <li><a class="nav__link" href="#home">My Decks</a></li>
          <li><a class="nav__link" href="#about">About</a></li>
        </ul>
      </nav>
    </header>
    <main class="page__main-content">
      <section id="home" class="gallery gallery_type_home">
        <h2 class="gallery__title">My Decks</h2>
        <ul class="gallery__list">
          <template id="deck-template">
            <li class="card card_color_green">
              <a class="card__link" href="#">
                <h3 class="card__title"></h3>
              </a>
              <div class="card__row">
                <p class="card__count"></p>
                <button
                  type="button"
                  class="card__delete-btn"
                  aria-label="Delete this deck"
                >
                  <img src="assets/images/delete.svg" alt="trash can" />
                </button>
              </div>
            </li>
          </template>
        </ul>
        <button class="gallery__new-deck-btn">+ New Deck</button>
      </section>
      <section id="deck-view" class="gallery" hidden>
        <div class="gallery__header">
          <h2 class="gallery__title">Deck View</h2>
          <button type="button" class="gallery__practice-btn">Practice</button>
        </div>
        <ul class="gallery__list">
          <template id="card-template">
            <li class="card card_color_green">
              <p class="card__text"></p>
              <div class="card__row">
                <button
                  type="button"
                  class="card__flip-btn"
                  aria-label="Show answer"
                ></button>
                <button
                  type="button"
                  class="card__delete-btn"
                  aria-label="Delete this card"
                >
                  <img src="assets/images/delete.svg" alt="" />
                </button>
              </div>
            </li>
          </template>
        </ul>
        <button type="button" class="gallery__new-card-btn">
          <span>+ New Card</span>
        </button>
      </section>
      <div id="confirmation-modal" class="modal">
        <div class="modal__container">
          <p class="modal__text"></p>
          <div class="modal__buttons">
            <button type="button" class="modal__btn modal__btn_type_cancel">
              Cancel
            </button>
            <button type="button" class="modal__btn modal__btn_type_confirm">
              Delete
            </button>
          </div>
        </div>
      </div>
      <section id="not-found" class="not-found" hidden>
        <h2 class="not-found__status-code">404</h2>
        <p class="not-found__text">Sorry, nothing found!</p>
      </section>
      <section id="carousel" class="carousel" hidden>
        <h2 class="carousel__title">
          <span>Carousel</span>
        </h2>
        <div class="carousel__row">
          <button
            type="button"
            aria-label="Go to previous card in deck"
            class="carousel__btn carousel__btn_type_left carousel__btn_disabled"
          ></button>
          <div class="carousel__card">
            <p class="carousel__card_text"></p>
          </div>
          <button
            type="button"
            aria-label="Go to next card in deck"
            class="carousel__btn carousel__btn_type_right"
          ></button>
        </div>
        <button
          type="button"
          aria-label="Flip card"
          class="carousel__btn carousel__btn_type_flip"
        ></button>
      </section>
      <section class="new-deck-view" id="new-deck-view">
        <h2 class="new-deck-view__title">New Deck</h2>
        <form class="new-deck-view__form" id="new-deck-form">
          <fieldset class="new-deck-view__color-picker">
            <legend class="new-deck-view__legend">Pick the deck color</legend>
            <label class="new-deck-view__color-label" for="green">
              <input
                class="new-deck-view__color-input new-deck-view__color-input_color_green"
                aria-label="Green"
                name="color"
                id="green"
                value="#64D583"
                type="radio"
                checked
              />
            </label>
            <label class="new-deck-view__color-label" for="blue">
              <input
                class="new-deck-view__color-input new-deck-view__color-input_color_blue"
                aria-label="Blue"
                name="color"
                id="blue"
                value="#91A8F9"
                type="radio"
              />
            </label>
            <label class="new-deck-view__color-label" for="purple">
              <input
                class="new-deck-view__color-input new-deck-view__color-input_color_purple"
                aria-label="Purple"
                name="color"
                id="purple"
                value="#AA8EF0"
                type="radio"
              />
            </label>
            <label class="new-deck-view__color-label" for="pink">
              <input
                class="new-deck-view__color-input new-deck-view__color-input_color_pink"
                aria-label="Pink"
                name="color"
                id="pink"
                value="#EE92D7"
                type="radio"
              />
            </label>
            <label class="new-deck-view__color-label" for="orange">
              <input
                class="new-deck-view__color-input new-deck-view__color-input_color_orange"
                aria-label="Orange"
                name="color"
                id="orange"
                value="#EE955E"
                type="radio"
              />
            </label>
            <label class="new-deck-view__color-label" for="yellow">
              <input
                class="new-deck-view__color-input new-deck-view__color-input_color_yellow"
                aria-label="Yellow"
                name="color"
                id="yellow"
                value="#F5D770"
                type="radio"
              />
            </label>
          </fieldset>
          <label class="new-deck-view__deck-input" for="new-deck"
            >Write the JSON array of cards so that it matches this schema
            <textarea></textarea>
          </label>
          <button
            type="submit"
            class="new-deck-submit-btn"
            aria-label="submit"
            disabled
          >
            Create the Deck
          </button>
        </form>
      </section>
    </main>
    <footer class="footer">
      <p class="footer__text">&copy; 2026 Marshall Brown</p>
    </footer>
  </body>
</html>
